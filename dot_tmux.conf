# ~/.tmux.conf
# ============================================================
# 1. PREFIX: Ctrl-A вместо Ctrl-B
# ============================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# на случай если нажал C-b по привычке — можно раскомментировать,
# чтобы он тоже работал как дублирующий prefix:
# set -g prefix2 C-b
# bind C-b send-prefix -2

# ============================================================
# 2. Базовые удобства
# ============================================================
set -g base-index 1              # окна нумеруются с 1, а не с 0
setw -g pane-base-index 1        # то же для панелей
set -g renumber-windows on       # при закрытии окна остальные перенумеровываются
set -g history-limit 50000       # длинная история скролла (дефолт всего 2000)
set -g escape-time 10            # критично для neovim: без задержки на Esc
set -g focus-events on           # чтобы neovim корректно ловил focus/autoread
set -g mouse on                  # мышь: клик по панелям/окнам, ресайз мышью

# true color / нормальные цвета (важно для цветовых схем в nvim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# перезагрузка конфига без выхода из tmux
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================
# 3. Более интуитивные сплиты
# ============================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # вертикальный сплит
bind - split-window -v -c "#{pane_current_path}"   # горизонтальный сплит
# новое окно тоже открывается в текущей директории
bind c new-window -c "#{pane_current_path}"

# ============================================================
# 4. Vim motions: навигация между панелями (prefix + hjkl)
#    Не конфликтует с neovim: работает только сразу после prefix,
#    внутри самого nvim у тебя останутся свои обычные hjkl.
# ============================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ресайз панелей теми же клавишами, но заглавными
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
# 5. Vim motions в copy-mode (когда листаешь буфер/скроллишь)
#    Это отдельный режим tmux, с самим neovim не пересекается.
# ============================================================
setw -g mode-keys vi
bind Enter copy-mode              # войти в copy-mode по prefix+Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# 6. Статус-бар (минимально, чтобы не мешал)
# ============================================================
set -g status-position bottom
set -g status-style bg=default
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d %H:%M"
set -g window-status-current-style bold

# ============================================================
# 7. tmux-sessionizer: prefix + f открывает popup с fzf
# ============================================================
bind-key f run-shell "tmux display-popup -E -w 80% -h 80% ~/.local/bin/tmux-sessionizer.sh"

# ============================================================
# 8. Плагины (через TPM — Tmux Plugin Manager)
#    Установка TPM (один раз):
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#    Затем в tmux: prefix + I  (заглавная i) — поставит плагины
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'          # копирование в системный буфер (в т.ч. по ssh, через OSC52)
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl-h/j/k/l переключают панели tmux <-> nvim бесшовно

# --- автосохранение сессий ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'   # сохранять содержимое панелей, не только layout
set -g @continuum-restore 'on'                 # автовосстановление сессий при старте tmux
set -g @continuum-save-interval '15'           # автосейв каждые 15 минут

# инициализация TPM — эта строка должна быть в самом конце файла
if "test ! -d ~/.tmux/plugins/tmux-resurrect" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

